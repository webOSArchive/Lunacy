<div class="prefs-location-main on">
	<div class="palm-page-header">
		<div class="header-icon location"></div>
		<div class="header-text">
			<span x-mojo-loc=''>Location services</span>
		</div>
	</div>
	
	<div class="palm-body-text">
		<div class="section" x-mojo-loc=''>You have turned off all location data sources. No location data will be provided to applications that request your location.</div>
	</div>
	
	<div class="scene-footer">
		<div class="scene-footer-wrapper">
			<div class="palm-button primary" id="gps_turnon" x-mojo-tap-highlight="momentary">
				<div class="palm-button-wrapper" x-mojo-loc="">Turn On GPS</div>
			</div>			
		</div>
	</div>
	<div class="scene-footer-spacer"></div>
</div>
