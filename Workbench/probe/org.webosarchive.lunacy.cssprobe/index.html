<!doctype html>
<html>
<head>
<meta name="viewport" content="height=device-height">
<title>CSS Probe</title>
<!-- Mojo's own stylesheets, so the widget classes under test are the real ones. -->
<link href="/usr/palm/frameworks/mojo/submissions/506/stylesheets/global.css" media="screen" rel="stylesheet" type="text/css">
<link href="/usr/palm/frameworks/mojo/submissions/506/stylesheets/global-dev.css" media="screen" rel="stylesheet" type="text/css">
<style>
/* Mojo's body rule, from global-base.css, repeated here so it applies whether or not the
   link above resolved. The card's background hangs off what its height resolves to. */
body { min-height: 480px; height: 100%; margin: 0; padding: 0; }
#out { font: 12px monospace; white-space: pre-wrap; background: #fff; color: #000; }
.probe { position: absolute; left: 0; top: 0; visibility: hidden; }

/* drPodder's own rules for the row either side of the slider, from its stylesheets/main.css.
   The slider between them is Mojo's .stream-buffer-bar, which is a 60% table-cell. */
.stream-info { padding-bottom: 12px; }
.stream-info .elapsed, .stream-info .duration {
	font-size: 14px; vertical-align: middle; display: table-cell; text-align: center; width: 20%;
}
</style>
</head>
<body>
<pre id="out"></pre>
<!-- Two swatches for the camera: the same image at background-size: 100% 100%, one with
     background-attachment: fixed and one without. With a 2x2 image, resolving the size
     against the element shows four quadrants; resolving it against the viewport, as the
     spec says a fixed background does, shows the slice of a viewport-sized image that falls
     where the swatch is - two colours at most, and usually one. -->
<div id="swatches" style="position:absolute; top:150px; left:20px">
  <div id="sw-fixed" style="width:200px;height:60px;border:2px solid #000;background-repeat:repeat;background-position:center center;-webkit-background-size:100% 100%;background-size:100% 100%;background-attachment:fixed"></div>
  <div style="height:8px"></div>
  <div id="sw-scroll" style="width:200px;height:60px;border:2px solid #000;background-repeat:repeat;background-position:center center;-webkit-background-size:100% 100%;background-size:100% 100%;background-attachment:scroll"></div>
</div>
<script src="cssprobe.js"></script>
</body>
</html>
