<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Luna DE</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!-- The device: a TouchPad's screen, 1024 x 768 or turned to 768 x 1024, and below it Luna DE's
     bezel with the home button (Docs/luna-de.md, milestone 3b). -->
<div id="screen">
	<div id="cards"></div>
	<div id="pill"><span>Just type...</span></div>
	<div id="launcher" hidden>
		<div id="tabbar"><div id="tabs"></div><button id="tab-add" hidden title="New tab"></button><button id="tab-done" hidden>DONE</button></div>
		<div id="grid"></div>
		<div id="empty-page" hidden><span>Tap and hold any app to drag it to this page.</span></div>
	</div>
	<div id="quicklaunch"><div id="dock"></div><button id="launcher-button" title="Launcher"></button></div>
	<div id="statusbar">
		<div id="title"><span id="title-text">Luna DE</span><span class="arrow"></span></div>
		<div id="status-right">
			<div id="notes" hidden><span id="banner" hidden><img id="banner-icon" alt=""><span id="banner-text"></span></span><span id="note-icons"></span><span class="arrow"></span></div>
			<span class="icon wifi"></span><span class="icon battery"></span><span id="clock"></span>
		</div>
	</div>
	<!-- The dashboards' drop-down and a popup alert: frames here, the windows themselves live
	     views main.js lays over them (luna-de:place). -->
	<div id="dashboards" hidden></div>
	<div id="alert" hidden></div>
	<canvas id="keyboard" hidden></canvas>
	<!-- LunaCE's launcher dialogs, over the launcher: a group's panel, Rename Tab / New Tab, Remove Application. -->
	<div id="scrim" hidden></div>
	<div id="menu" hidden></div>
</div>
<div id="bezel"><button id="popout" title="Pop this card out into a window of its own" disabled></button><button id="devtools" title="Logs: every app's console in one window. Right-click to inspect a card"></button><button id="zoom" title="Phone Zoom for this app: its page laid out 640 px wide and shown whole, for an app written for a TouchPad (the card loads again)" disabled></button><button id="realkb" class="on" title="A real keyboard is attached: the on-screen keyboard stays away. Click to take it away."></button><button id="home" title="Home: the card view (F1)"></button><button id="device" title="The device: an HP TouchPad or an HP Pre3 (changing it closes the open apps)"><img alt=""></button><button id="rotate" title="Turn the device: wide or tall (F6 to F9 for each way up)"></button></div>
<script src="shell.js"></script>
<script src="keyboard.js"></script>
</body>
</html>
