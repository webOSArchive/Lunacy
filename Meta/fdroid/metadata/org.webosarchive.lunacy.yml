Name: Lunacy
Summary: Run legacy webOS apps inside a shell that looks and feels like webOS
Description: |-
    webOS apps were HTML and JavaScript. They loaded their framework (Enyo or Mojo) from the
    OS, ran as cards in the Luna system shell, and talked to the system over the Luna service
    bus. The devices are more than a decade old, but the apps are still good: most of them
    never needed Palm's hardware, only Palm's contract. Lunacy provides that contract on
    Android.

    * A Luna shell with the HP TouchPad's card view, gestures, launcher, notifications and
      dashboard, measured on a real device (and the Pre3's, on a phone).
    * Enyo 1 and Mojo apps run unmodified, each card in its own WebView.
    * The Luna service bus, routed to Lunacy itself or to Android's own features.
    * webOS's own apps: Email, Calendar, Contacts, Photos, Messaging, Music and more.
    * Native PDK games run too.
    * Install apps from the webOS App Museum.

    Lunacy can be Android's home screen or an ordinary app.

    Lunacy's own code is Apache 2.0. It also ships Palm's and HP's webOS frameworks, apps,
    fonts and artwork, which were never released under an open licence and are distributed
    as abandonware; see the NOTICE in the source.
