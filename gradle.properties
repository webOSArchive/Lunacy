org.gradle.jvmargs=-Xmx2g
# On only so the unit tests can use Robolectric, which brings AndroidX test libraries; the
# app itself has no AndroidX dependency, so nothing changes in the APK.
android.useAndroidX=true
# The version name both APKs carry, codepoet's to change by hand for a release (build.sh reads it).
versionName=0.9.4
