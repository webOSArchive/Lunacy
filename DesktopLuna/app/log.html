<!doctype html>
<html><head><meta charset="utf-8"><title>Luna DE: logs</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
html, body { height: 100%; margin: 0; background: #16171a; color: #d6d6d6; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; }
body { display: flex; flex-direction: column; }
#bar { flex: none; display: flex; gap: 10px; align-items: center; padding: 6px 8px; background: #23252a; border-bottom: 1px solid #000; font-family: system-ui, sans-serif; }
#bar input[type=text] { flex: 1; min-width: 80px; background: #111; color: #eee; border: 1px solid #444; border-radius: 3px; padding: 3px 6px; font: inherit; }
#bar label { white-space: nowrap; }
#bar button { background: #333; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 3px 10px; cursor: pointer; }
#lines { flex: 1; overflow: auto; padding: 4px 0; }
.l { display: flex; gap: 8px; padding: 0 8px; white-space: pre-wrap; word-break: break-word; border-bottom: 1px solid #1d1f23; }
.l .t { color: #777; flex: none; }
.l .a { color: #7fb2e5; flex: none; max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l .m { flex: 1; }
.l .s { color: #666; flex: none; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; }
.l.warning { background: #2b2610; color: #e8d37a; }
.l.error { background: #2e1414; color: #f29a9a; }
.l.debug .m { color: #999; }
.hide { display: none; }
</style></head>
<body>
<div id="bar">
	<input id="filter" type="text" placeholder="Filter: an app id or any text">
	<label><input type="checkbox" id="lv-debug" checked> debug</label>
	<label><input type="checkbox" id="lv-info" checked> info</label>
	<label><input type="checkbox" id="lv-warning" checked> warn</label>
	<label><input type="checkbox" id="lv-error" checked> error</label>
	<label><input type="checkbox" id="follow" checked> follow</label>
	<button id="clear">Clear</button>
</div>
<div id="lines"></div>
<script src="log.js"></script>
</body></html>
